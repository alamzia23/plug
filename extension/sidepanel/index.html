<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>plug</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="masthead">
      <h1 class="wordmark">plug</h1>
      <p class="tagline">find your <em>plug</em>, get the referral.</p>
    </header>

    <details class="setup" id="setup">
      <summary class="setup-toggle">backend</summary>
      <div class="setup-body">
        <label class="field">
          <span class="key">web app url</span>
          <input id="cfg-url" type="url" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" />
        </label>
        <label class="field">
          <span class="key">token</span>
          <input id="cfg-token" type="password" spellcheck="false" placeholder="from setUp()" />
        </label>
        <div class="setup-actions">
          <button id="cfg-save" class="btn-ghost" type="button">save + test</button>
          <span id="cfg-state" class="cfg-state"></span>
        </div>
      </div>
    </details>

    <div class="act">
      <button id="capture" class="btn-primary" type="button">capture this job</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </div>

    <main id="list" class="list"></main>

    <footer class="footer">
      <span id="count">0 jobs</span>
      <span class="dot">·</span>
      <span id="sync-state">local only</span>
      <button id="sync-all" class="btn-link" type="button" hidden>push</button>
    </footer>

    <!-- one job = one ticket. cloned per job, filled with textContent only. -->
    <template id="ticket-tpl">
      <article class="ticket">
        <div class="ticket-top">
          <h2 class="role" data-field="role"></h2>
          <button class="drop" type="button" title="drop this job" aria-label="drop this job">
            ×
          </button>
        </div>

        <div class="rows">
          <div class="row">
            <span class="key">company</span>
            <input class="val" data-edit="company" spellcheck="false" placeholder="—" />
          </div>
          <div class="row">
            <span class="key">role</span>
            <input class="val" data-edit="role" spellcheck="false" placeholder="—" />
          </div>
          <div class="row">
            <span class="key">where</span>
            <input class="val" data-edit="location" spellcheck="false" placeholder="—" />
          </div>
          <div class="row">
            <span class="key">via</span>
            <span class="val val-static source"></span>
          </div>
          <div class="row">
            <span class="key">caught</span>
            <span class="val val-static when"></span>
          </div>
        </div>

        <hr class="perf" />

        <details class="jd-wrap">
          <summary class="jd-summary"></summary>
          <pre class="jd"></pre>
        </details>

        <div class="ticket-foot">
          <span class="tag tag-status">draft</span>
          <span class="tag tag-conf"></span>
          <span class="tag tag-sync"></span>
          <a class="src-link" target="_blank" rel="noreferrer">open</a>
        </div>
      </article>
    </template>

    <script src="api.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
